<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beagle Choco Arkanoid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>Beagle Choco Arkanoid</h1>
      <p>Rompe los bloques, atrapa chocolates y no dejes caer la pelota.</p>
      <canvas id="game" width="900" height="600" aria-label="Juego de arkanoid"></canvas>
      <div class="hud">
        <span id="score">Puntos: 0</span>
        <span id="lives">Vidas: 3</span>
        <span id="chocos">Chocolates: 0</span>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
